/* 代号Mr.Blue v0.2 | 导航优先，Apple-inspired 微交互 */
:root{
 color-scheme:light;

:root[data-theme='dark']{

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}

.ambient{position:fixed;z-index:-1;pointer-events:none;inset:-300px -200px auto auto;width:750px;height:650px;background:radial-gradient(circle,rgba(110,167,255,.17),transparent 67%);filter:blur(9px)}

      if(event.target.closest('[data-reset]'))clearSearch();
    });
    [E.categoryDialog,E.assignDialog].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)closeDialog(d);}));
    E.grid.addEventListener('click',()=>{if(view!=='grid'){view='grid';storage.set('mrblue:view',view);render(true);}});
    E.list.addEventListener('click',()=>{if(view!=='list'){view='list';storage.set('mrblue:view',view);render(true);}});
    E.theme.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';storage.set('mrblue:theme',theme);setTheme();});
    if(systemDark.addEventListener)systemDark.addEventListener('change',e=>{if(!storage.get('mrblue:theme')){theme=e.matches?'dark':'light';setTheme();}});
    document.addEventListener('keydown',e=>{
      const editing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();E.search.focus();E.search.select();}
      else if(e.key==='/'&&!editing&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!E.categoryDialog.open&&!E.assignDialog.open){e.preventDefault();E.search.focus();}
      else if(e.key==='Escape'&&document.activeElement===E.search){if(query){query='';E.search.value='';E.clear.hidden=true;E.hint.hidden=false;renderCards();}else E.search.blur();}
    });
    E.container.addEventListener('pointermove',e=>{if(reduceMotion.matches)return;const card=e.target.closest('.site-card');if(!card)return;const r=card.getBoundingClientRect();card.style.setProperty('--mx',`${(e.clientX-r.left)/r.width*100}%`);card.style.setProperty('--my',`${(e.clientY-r.top)/r.height*100}%`);},{passive:true});
  }
  init();
})();

</script>
</body>
</html>
