function living(){return S.party.filter(p=>p.alive)}function has(k){return S.mods.includes(k)}function role(r){return living().some(p=>p.role===r)}function beds(){return Math.min(12,4+(has('bed')?2:0)+(has('bunk')?3:0)+(has('storage')?0:0)+(has('roof')?0:0)+3*(has('bunk')&&has('bed')?1:0))}function space(){return 5-S.mods.reduce((n,id)=>n+(MODS.find(m=>m[0]===id)?.[4]||0),0)}function capacity(){return 115+(has('storage')?12:0)+(has('rack')?18:0)+(has('roof')?15:0)}function fuelCap(){return has('tank')?80:60}function weight(){return Math.ceil(S.res.food+S.res.water+S.res.med+S.res.parts+S.res.ammo*.25+S.bag.length*2)}function protection(){return Math.min(.65,(has('bumper')?.16:0)+(has('mesh')?.14:0)+(has('plate')?.22:0)+(has('heavyplate')?.32:0))}function add(k,n){let old=S.res[k];let max=k==='fuel'?fuelCap():Math.max(old,old+capacity()-weight());S.res[k]=clamp(old+n,0,max);return S.res[k]-old}function log(s){S.log.unshift(s);S.log=S.log.slice(0,30)}function save(){if(!S||S.ending||mode==='battle'||mode==='travel'||mode==='title')return;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}function beep(freq=180,d=.06,type='triangle'){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.5),audio.currentTime+d);g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function toggleSound(){sound=!sound;$('soundBtn').textContent='音效 '+(sound?'开':'关')}

function render(){if(!S)return; $('day').textContent=`第 ${S.day} 天 · ${['清晨','午后','黄昏'][S.step%3]}`;$('distance').textContent=`${S.km} / 300 km`;$('progress').style.width=S.km/3+'%';$('resources').innerHTML=Object.entries(RES).map(([k,[ic,n]])=>`<div class="res"><span class="ric">${ic}</span><div><b class="num ${S.res[k]<=3?'bad':''}">${Math.floor(S.res[k])}${k==='fuel'?' L':''}</b><small>${n}</small></div></div>`).join('');$('busStatus').textContent=S.bus.hp<30?'危险':S.bus.hp<65?'受损':'正常';$('busStatus').className='tag '+(S.bus.hp<30?'bad':S.bus.hp<65?'warn':'good');$('busStats').innerHTML=[['车身',S.bus.hp],['引擎',S.bus.engine],['轮胎',S.bus.tires]].map(([n,v])=>`<div class="statline"><span>${n}</span><div class="track" style="width:49%"><i style="width:${v}%;background:${v<35?'#db8979':'#a9bd91'}"></i></div><b>${Math.round(v)}%</b></div>`).join('')+`<div class="divider"></div><div class="statline"><span>床位</span><b>${living().length} / ${beds()}</b></div><div class="statline"><span>载重</span><b class="${weight()>capacity()?'warn':''}">${weight()} / ${capacity()}</b></div>`;$('party').innerHTML=S.party.map((p,i)=>p.alive?`<div class="person" onclick="openTeam(${i})"><div class="portrait">${portrait(p)}</div><div class="pinfo"><b>${esc(p.name)}</b> <small>${p.role}</small><div class="hp"><i style="width:${p.hp}%;background:${p.hp<35?'#d87d6c':'#9db989'}"></i></div></div><small class="${p.infect?'bad':''}">${p.infect?'感染 '+p.infect+'%':Math.round(p.hp)+'%'}</small></div>`:'').join('');$('log').innerHTML=S.log.slice(0,7).map(l=>`<div>${esc(l)}</div>`).join('');$('viewBtn').hidden=mode!=='base';$('viewBtn').textContent=view==='outside'?'查看车内':'查看外观';$('combatHud').hidden=mode!=='battle';$('touch').classList.toggle('on',mode==='battle');$('locLabel').textContent=mode==='battle'?(battle.defend?'尸潮防守':battle.loc.name):mode==='travel'?'公路 · 自动行驶':`${S.at} · ${S.km<100?'城市边缘':S.km<200?'荒野公路':'感染封锁区'}`;let title='',desc='',actions='';if(mode==='base'){if(S.stage==='arrived'){title= function nav(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t))}function openSheet(title,sub,body,foot='',type='generic'){modal=type;$('sheetTitle').textContent=title;$('sheetSub').textContent=sub;$('sheetBody').innerHTML=body;$('sheetFoot').innerHTML=foot||'<button onclick="closeSheet()">完成</button>';$('shade').hidden=false;mouse.down=false;keys={};}function closeSheet(){ $('shade').hidden=true;modal='';keys={};mouse.down=false;nav('bus') }function busHome(){if(mode==='base'){closeSheet();nav('bus')}}function toggleView(){view=view==='outside'?'inside':'outside';render()}
function newGame(tutorial){try{localStorage.removeItem(SAVE)}catch(e){}S=fresh();placement=null;mode='base';view='outside';battle=null;travel=null;$('titleScreen').hidden=true;closeSheet();makeChoices();render();save();if(tutorial)help(true)}function continueGame(){try{S=JSON.parse(localStorage.getItem(SAVE));if(!S||S.version!==12)throw Error();mode='base';view='outside';$('titleScreen').hidden=true;closeSheet();if(!S.choices.length&&S.stage!=='arrived')makeChoices();render();save()}catch(e){newGame(true)}}function settings(){openSheet('设置','游戏控制',`<div class="tiles"><div class="tile"><h3>背景音乐</h3><p>原创环境配乐 · 进入探索时自动切换氛围。</p><button onclick="toggleMusic();settings()">${musicOn?'关闭':'开启'}音乐</button><p>音乐音量 <input aria-label="音乐音量" type="range" min="0" max="100" value="${Math.round(musicVolume*100)}" oninput="setMusicVolume(this.value/100)"></p></div><div class="tile"><h3>音效</h3><p>程序合成的环境与战斗提示音。</p><button onclick="toggleSound();settings()">${sound?'关闭':'开启'}音效</button></div><div class="tile"><h3>存档</h3><p>巴士整备与停靠时自动保存。战斗中退出将从该停靠点重新开始。</p><button onclick="${mode==='base'?'save();toast(\'已保存\')':'toast(\'仅整备时可保存\')'}">手动保存</button></div><div class="tile"><h3>重新开始</h3><p>开启全新随机旅程，覆盖当前存档。</p><button class="danger" onclick="confirmRestart()">新旅程</button></div><div class="tile"><h3>操作指南</h3><p>可随时重新查看教学。</p><button onclick="help()">查看指南</button></div></div>`)}function confirmRestart(){openSheet('重新开始？','此操作覆盖当前存档','<p>现有旅程将被替换。</p>','<button onclick="settings()">取消</button><button class="primary" onclick="newGame(true)">确认开始</button>')}
function help(first=false){openSheet(first?'出发前的准备':'操作指南','V1.2 · 300公里 · 生存手册',`<p class="muted" style="margin-bottom:12px">选路 → 自动行驶 → 选择停靠点周边区域 → 下车搜刮 → 撤回巴士 → 整备。每站可反复探索三个区域，已搜空的容器不会刷新。每段约30–50公里，最终抵达300公里的安全区。</p><div class="helpgrid"><div><h3>01 · 路线</h3><p>燃油不足会抛锚。尽量选择能补足稀缺资源的地点，避免不必要的高危战斗。</p></div><div><h3>02 · 搜刮</h3><p>WASD移动，鼠标瞄准，左键攻击，Shift冲刺。靠近家具按 E 搜索，等待完成后选择拾取。R 换弹，Q 循环已装备武器，F 同伴开火模式，H 随身治疗。</p></div><div><h3>03 · 撤离</h3><p>枪声吸引附近丧尸，安静时不再持续刷新。回到绿色巴士区域按 E 或点击撤离。所有队员和被救者到达撤离区才可离开。1跟随、2坚守、3撤回。</p></div><div><h3>04 · 巴士</h3><p>队伍自动工作，治疗与休整消耗资源。改装受零件、车内空间限制；装备支持拖拽或点击选择。</p></div><div><h3>05 · 感染</h3><p>丧尸袭击可能造成感染。医疗、隔离可减缓恶化，感染满值会失去该成员。</p></div><div><h3>06 · 生存</h3><p>车身归零、所有人死亡或燃油彻底耗尽会结束旅程。Tab打开背包，Esc暂停。触屏有方向与攻击键。</p></div></div>`, `<button class="primary" onclick="closeSheet()">${first?'发动巴士':'返回游戏'}</button>`,'help')}
function makeChoices(){if(S.km>=300){S.choices=[];return}let pool=LOCS.filter(l=>l.risk<4||S.km>=100);let types=[];while(types.length<3){let l=pick(pool);if(!types.includes(l))types.push(l)}S.choices=types.map((l,i)=>{let km=Math.min(300-S.km,R(31,45));return {id:l.id,km,risk:l.risk,road:pick(['平坦公路','碎石道路','绕行小路']),weather:pick(['晴朗','阴天','小雨','薄雾']),event:R(0,EVENTS.length-1)}})}
function travelCost(c){return Math.max(2,Math.ceil(c.km/6)+(has('heavyplate')?2:has('plate')?1:0)+(weight()>capacity()?2:0)+(S.bus.engine<40?3:0)+(S.bus.tires<40?2:0)+(weight()>capacity()*.75?1:0)-(role('司机')?1:0)-(has('engine')?2:0))}
function openMap(){if(mode!=='base')return;if(S.stage==='arrived'){toast('请先探索或跳过当前停靠点');return}if(S.km>=300){finish(true);return}nav('map');if(!S.choices.length)makeChoices();let bars=Array.from({length:9},(_,i)=>`<span class="${i<Math.floor(S.km/34)?'done':i===Math.floor(S.km/34)?'now':''}"></span>`).join('');let cards=S.choices.map((c,i)=>{let l=LOCS.find(x=>x.id===c.id),cost=travelCost(c);return `<button class="routecard" onclick="depart(${i})" ${S.res.fuel<cost?'disabled':''}><span class="symbol">${l.icon}</span><b>${l.name}</b><span class="tag ${l.risk>=3?'bad':l.risk===2?'warn':'good'}">${['','低风险','中风险','高风险','极高风险'][l.risk]}</span><p>${l.desc}</p><div class="range">${c.road} · ${c.weather}</div><div class="range">${c.km} km · ${cost} L燃油${has('radio')?' · '+EVENTS[c.event][1]:''}</div></button>`}).join('');let min=Math.min(...S.choices.map(travelCost));openSheet('规划下一站',`${S.km} / 300 公里 · 选择路线`, `<div class="routebar">${bars}</div><div class="routegrid">${cards}</div><div class="divider"></div><p class="muted">每段预计消耗 ${foodCost()} 食物、${waterCost()} 饮水。路线选择后自动行驶。${S.res.fuel<min?' 燃油不足，可以紧急搜寻油桶。':''}</p>${S.res.fuel<min?'<button style="margin-top:10px" onclick="emergencyFuel()">紧急搜寻燃油</button>':''}<p class="muted" style="margin-top:9px">已途经：${S.visited.length?S.visited.map(esc).join(' · '):'出发地'}</p>`,undefined,'map')}
function foodCost(){return Math.max(1,Math.ceil(living().length*.78)-(role('厨师')?1:0)-(has('kitchen')?1:0))}function waterCost(){return Math.max(1,Math.ceil(living().length*.78)+(S.step%3===2?1:0)-(has('water')?1:0))}
function emergencyFuel(){if(S.res.parts>=3){S.res.parts-=3;add('fuel',10);log('拆解备用零件，换取10 L燃油。');render();save();openMap()}else if(!S.emergencyUsed){S.emergencyUsed=true;add('fuel',8);S.bus.hp=Math.max(1,S.bus.hp-15);log('最后一次应急搜寻找到8 L燃油，巴士受损。');render();save();openMap()}else finish(false,'燃油耗尽，巴士再也无法发动。')}
function depart(i){if(mode!=='base'||S.stage==='arrived')return;let c=S.choices[i];if(!c||S.res.fuel<travelCost(c))return;closeSheet();S.res.fuel-=travelCost(c);travel={choice:c,elapsed:0,duration:2.5,from:S.km};mode='travel';render();beep(70,.2,'sawtooth')}

function arrive(){let c=travel.choice,l=LOCS.find(x=>x.id===c.id);S.km+=c.km;S.step++;S.day=1+Math.floor(S.step/3);S.at=l.name;S.weather=c.weather;S.visited.push(l.name);S.rested=false;let fc=foodCost(),wc=waterCost(),hungry=S.res.food<fc,thirst=S.res.water<wc;let foodDef=Math.max(0,fc-S.res.food)/fc,waterDef=Math.max(0,wc-S.res.water)/wc;S.res.food=Math.max(0,S.res.food-fc);S.res.water=Math.max(0,S.res.water-wc);for(let p of living()){p.fatigue=clamp(p.fatigue+R(4,10),0,100);p.hunger=hungry?(p.hunger||0)+foodDef:Math.max(0,(p.hunger||0)-1);p.thirst=thirst?(p.thirst||0)+waterDef:Math.max(0,(p.thirst||0)-1);p.hp=clamp(p.hp-Math.round(foodDef*(3+Math.min(9,p.hunger*2)))-Math.round(waterDef*(5+Math.min(12,p.thirst*3))),0,100);if(p.infect)p.infect=clamp(p.infect+(has('isolate')?4:role('医生')?8:14),0,100);if(p.hp<=0||p.infect>=100)killPerson(p,p.infect>=100?'因感染离世':'因物资短缺离世')}

function scheduleMusic(){if(!audio||audio.state!=='running')return;if(musicNext<audio.currentTime)musicNext=audio.currentTime+.06;while(musicNext<audio.currentTime+.28){let combat=mode==='battle',pace=combat?.42:.65,beat=musicBeat%32,chords=[[45,52,57,60],[41,48,53,57],[48,55,60,64],[43,50,55,58]],c=chords[Math.floor(beat/8)];if(musicOn){if(beat%8===0){musicNote(c[0],musicNext,pace*7.8,.19);musicNote(c[1],musicNext,pace*7.5,.07);musicNote(c[2],musicNext,pace*6.8,.047,'triangle')}if(beat%2===0)musicNote(c[[1,2,3,2][Math.floor(beat/2)%4]]+12,musicNext,pace*1.7,combat?.085:.07,'triangle');if(combat&&beat%4===0)musicNote(c[0]-12,musicNext,.32,.19)}musicNext+=pace;musicBeat++}}
window.addEventListener('pointerdown',startMusic);window.addEventListener('keydown',startMusic);document.addEventListener('visibilitychange',()=>{if(!audio)return;if(document.hidden)audio.suspend();else if(musicOn||sound)audio.resume()});
