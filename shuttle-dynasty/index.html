.initiative151.map((v,i)=>`<p>${i?'对手':'我方'}：进攻 ${v.attack} · 防守 ${v.defense} · 争夺 ${v.neutral}</p>`).join(''):''}`:''}<div class="reportnote"><b>教练复盘</b><p>${notes.join(' ')}</p>${a.startRallies?`<small>此存档由旧版继续，新增数据仅涵盖后续 ${a.rallies} 个回合，不追溯先前 ${a.startRallies} 个回合。</small>`:''}</div></section>`)};

function help19(){return `<div class="help19"><details open><summary>01 · 从一名球员开始</summary><p>先在训练页配置每周至多5个训练日，选择强度和专项指导；计划会自动沿用。每赛季12站地方单打赛，在赛事中心报名，再推进本周。首个冠军后进入俱乐部创建页，确认后正式建队。</p></details><details><summary>02 · 看球与战术</summary><p>赛前制定战术，随后自动比赛。第一、二局结束及决胜局领先方先到8分时可以调整。15分三局两胜，14平后领先2分获胜，20平后第21分结束。可暂停、倍速或快进；快进仍使用逐拍比赛引擎。</p></details><details><summary>03 · 训练、技能与疲劳</summary><p>等级是综合技术概括，专项能力决定打法。技能通过训练和经验习得。可在训练页选择长期培养方向，并应用个性化建议。潜力决定成长上限，高强度训练会消耗体能；低体能容易受伤。后期高属性提升逐渐放缓。</p></details><details><summary>04 · 组队与双打</summary><p>首冠后招募球员并注册五项阵容，每项最多3名或3组。允许跨项但体能共享。双打在攻防状态改变时自动轮转；教练选择发接发、落点和战术倾向，而非强制固定站位。</p></details><details><summary>05 · 个人赛与团体赛</summary><p>个人赛按资格报名，每站每项可派一人或一组。国内排名取52周最佳6站，世界排名取最佳10站，总决赛按当季巡回赛积分选拔。俱乐部竞技声望由球员积分里程碑提高。每年两次团体杯，依序安排混双、男单、女单、男双、女双，先胜3项即结束，未设置的项目判弃权。可在年度赛历查看赛事。</p></details><details><summary>06 · 经营与职业生涯</summary><p>收入包括基础资助、赞助、代言、商品及赛事奖金。训练、薪资和差旅均需资金。代言会占训练日，避免过度扩张。经营总览提供8周现金预测与合约提醒。球员会老化、受伤、退役，记得续约并培养新人。</p></details><details><summary>07 · 存档与版本</summary><p>本游戏自动保存于浏览器。每个安全周初另存一个恢复点，失败时不会覆盖主存档。定期导出JSON，换浏览器或文件位置时导入。存档采用无损压缩，导出仍为普通JSON。装备暂不开放；现实资格规则、电脑赛事与转会采用游戏化简化。</p></details></div>`}
